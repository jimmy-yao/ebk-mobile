name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: '对线上实例跑 API 契约冒烟'
        type: boolean
        default: false

# 仓库公开时全部免费无额度限制；私库时 Linux job 1:1 计分钟
jobs:
  android:
    name: Flutter analyze / test / build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # step 的 if 不能直接用 secrets 上下文，先经 job env 中转
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    permissions:
      contents: write   # 打 tag 时创建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 解码签名 keystore（来自 Secrets，不进仓库）
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/android/upload-keystore.jks
          EOF

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ebk-mobile-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: 打 tag 时发 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "$GITHUB_REF_NAME" --generate-notes

  smoke:
    name: API 契约冒烟（线上实例）
    runs-on: ubuntu-latest
    # 只在手动触发时跑，避免无谓打扰生产服务
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 跑契约基线
        env:
          EBK_BASE_URL: ${{ vars.EBK_BASE_URL || 'https://ezbook.hapi.dpdns.org' }}
          EBK_USER: ${{ secrets.EBK_USER }}
          EBK_PASS: ${{ secrets.EBK_PASS }}
          EBK_2FA_PASSCODE: ${{ secrets.EBK_2FA_PASSCODE }}
        run: ./scripts/smoke.sh

  # iOS 后置（2026-10-06 决策）：启用 Apple Developer 后放开此 job

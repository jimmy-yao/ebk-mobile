name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: '对线上实例跑 API 契约冒烟'
        type: boolean
        default: false

# 仓库公开时全部免费无额度限制；私库时 Linux job 1:1 计分钟
jobs:
  android:
    name: Flutter analyze / test / build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # step 的 if 不能直接用 secrets 上下文，先经 job env 中转
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    permissions:
      contents: write   # 打 tag 时创建 Release 需要
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 解码签名 keystore（来自 Secrets，不进仓库）
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/android/upload-keystore.jks
          EOF

      # 单包实测 54.5MB，其中 99% 是原生 .so —— 因为一个 APK 塞了
      # arm64 + armv7 + x86_64 三份（18.3 + 15.9 + 19.7 MB），dex+资源才 0.4MB。
      # 按 ABI 拆包后单包约 19MB；x86_64 只有模拟器用，直接不编（省 20MB 与编译时间）。
      - name: 构建 release APK（按 ABI 拆包）
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          echo "== 产物体积 =="
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ebk-mobile-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: 打 tag 时发 GitHub Release（幂等：已存在则只补传产物）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/app/outputs/flutter-apk
          # 版本对齐闸门：versionName 必须等于 tag，否则同机升级语义会乱、
          # 文档里"版本对齐 tag"的规矩也会悄悄失守（本仓踩过一次：v0.1.5 打在了 0.1.4+14 上）
          pubver="$(awk '/^version:/{print $2}' pubspec.yaml)"
          if [ "${pubver%%+*}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::pubspec version=$pubver 与 tag=$GITHUB_REF_NAME 不一致"
            exit 1
          fi
          # 起个能一眼看出 ABI 的名字，用户照着 release 说明选包
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk"   "dist/ebk-mobile-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/ebk-mobile-${GITHUB_REF_NAME}-armeabi-v7a.apk"
          flags=()
          case "$GITHUB_REF_NAME" in
            v0.*) flags+=(--prerelease) ;;
          esac
          notes='**选包**：
          - `arm64-v8a` —— 2017 年之后的绝大多数手机（推荐）
          - `armeabi-v7a` —— 只支持 32 位的老机器

          按 ABI 拆包发布，单包由 54MB 降到约 19MB（原生 .so 占 99%，不拆就只能整包下载）。'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes" "${flags[@]}"
          fi

  smoke:
    name: API 契约冒烟（线上实例）
    runs-on: ubuntu-latest
    # 只在手动触发时跑，避免无谓打扰生产服务
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 跑契约基线
        env:
          EBK_BASE_URL: ${{ vars.EBK_BASE_URL || 'https://ezbook.hapi.dpdns.org' }}
          EBK_USER: ${{ secrets.EBK_USER }}
          EBK_PASS: ${{ secrets.EBK_PASS }}
          EBK_2FA_PASSCODE: ${{ secrets.EBK_2FA_PASSCODE }}
        run: ./scripts/smoke.sh

  # iOS 后置（2026-10-06 决策）：启用 Apple Developer 后放开此 job
  # ios:
